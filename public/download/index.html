<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0A0A0C">
  <title>Get Polyscope</title>

  <!-- Smart redirect for polyscopeapp.com/download.
       Served directly by GitHub Pages (no React bundle), so the hop is instant.

       Why this page is not a plain redirect: Instagram, TikTok and friends open
       links in a WKWebView that does NOT perform Universal Link interception on
       page load, so an automatic hop to apps.apple.com just renders the store's
       *web page* inside the social app.

       Why there is no JavaScript redirect chain either: the only thing these
       webviews honour is a genuine user-initiated navigation. A `location.href`
       assignment from script does not count, which is why an earlier version of
       this page did nothing at all when tapped. So every route below is a plain
       anchor with a real href — the tap itself is the mechanism, and JS only
       fills in the URLs. Nothing here can silently no-op.

       Routes, in descending order of directness:
         itms-apps://      the store's own scheme, if the host allows handoff
         x-safari-https:// hand off to Safari, where Universal Links work
         https://          always renders the listing, worst case in the webview

       The logo is served from public/logo-appicon.png rather than src/assets/
       because Vite content-hashes anything it bundles and this page is static.

       Keep APP_ID / APPLE_PROVIDER_TOKEN in sync with src/lib/links.ts. -->
  <link rel="canonical" href="https://apps.apple.com/us/app/polyscope/id6772628383">
  <link rel="icon" href="/logo-appicon.png">
  <link rel="apple-touch-icon" href="/logo-appicon.png">
  <noscript><meta http-equiv="refresh" content="0; url=https://apps.apple.com/us/app/polyscope/id6772628383"></noscript>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    (function () {
      var APP_ID = '6772628383';

      // Provider token from App Store Connect -> Analytics -> Acquisition ->
      // Campaigns. Leave empty until you have it: Apple ignores `ct` without a
      // matching `pt`, and the campaign URL shape is only worth using in pairs.
      var APPLE_PROVIDER_TOKEN = '';

      var SITE_URL = 'https://polyscopeapp.com/';
      var ua = navigator.userAgent || '';

      // ?s=ig_bio -> ct=ig_bio. Apple caps ct at ~30 chars and rejects most
      // punctuation, so squash to [a-z0-9_-] and truncate.
      function campaign() {
        var raw = new URLSearchParams(location.search).get('s') || '';
        return raw.toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 30);
      }

      // `scheme` is the full prefix: https, itms-apps, or x-safari-https.
      // Campaign links use Apple's /app/apple-store/id form, not /us/app/name/id.
      function storeUrl(scheme) {
        var ct = campaign();
        if (!APPLE_PROVIDER_TOKEN || !ct) {
          return scheme + '://apps.apple.com/us/app/polyscope/id' + APP_ID;
        }
        return scheme + '://apps.apple.com/app/apple-store/id' + APP_ID +
          '?pt=' + encodeURIComponent(APPLE_PROVIDER_TOKEN) +
          '&ct=' + encodeURIComponent(ct) +
          '&mt=8';
      }

      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        // iPadOS 13+ reports as desktop Safari but is the only touch "Mac".
        (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);

      // Webviews known to swallow Universal Links on direct navigation.
      var isInApp = /Instagram|FBAN|FBAV|FB_IAB|Threads|TikTok|BytedanceWebview|musical_ly|Twitter|LinkedInApp|Snapchat|Pinterest|Line\//i.test(ua);

      if (!isIOS) {
        // No Android build yet -> send everyone else to the landing page.
        window.location.replace(SITE_URL);
        return;
      }

      if (!isInApp) {
        // Safari/Chrome honour the Universal Link and open the App Store app.
        window.location.replace(storeUrl('https'));
        return;
      }

      // In-app browser: render the tap targets and let the user's own tap do
      // the navigating. No listeners, no preventDefault, no timers.
      document.documentElement.className = 'tap';
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('open').href = storeUrl('itms-apps');
        document.getElementById('safari').href = storeUrl('x-safari-https');
        document.getElementById('fallback').href = storeUrl('https');
      });
    })();
  </script>

  <style>
    :root {
      --black: #0A0A0C;
      --card: #121216;
      --green: #22C55E;
      --text: #F5F5F7;
      --muted: #6B7280;
      --border: rgba(255, 255, 255, 0.07);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
      background: var(--black);
      color: var(--muted);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
      /* Green bloom behind the icon, echoing the app's sonar visuals. */
      background-image:
        radial-gradient(60% 45% at 50% 22%, rgba(34, 197, 94, 0.16), transparent 70%),
        radial-gradient(40% 30% at 50% 8%, rgba(34, 197, 94, 0.10), transparent 70%);
      background-repeat: no-repeat;
    }

    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px calc(40px + env(safe-area-inset-bottom));
    }

    .logo {
      width: 92px;
      height: 92px;
      border-radius: 22px;
      display: block;
      border: 1px solid var(--border);
      /* Layered glow: tight ring, then a soft halo. */
      box-shadow:
        0 0 0 1px rgba(34, 197, 94, 0.14),
        0 8px 40px rgba(34, 197, 94, 0.28),
        0 2px 12px rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      margin: 22px 0 0;
    }

    .tagline {
      font-size: 15px;
      margin: 8px 0 0;
      color: var(--muted);
    }

    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      max-width: 320px;
      margin-top: 30px;
    }

    a { text-decoration: none; }

    .btn {
      display: block;
      width: 100%;
      background: var(--green);
      color: var(--black);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      padding: 17px 24px;
      border-radius: 999px;
      box-shadow: 0 6px 24px rgba(34, 197, 94, 0.32);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 3px 14px rgba(34, 197, 94, 0.26);
    }

    .sub {
      font-size: 14px;
      font-weight: 500;
      color: var(--green);
    }
    .sub.quiet { color: var(--muted); }

    .rule {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    .hint {
      font-size: 12.5px;
      line-height: 1.55;
      color: #4B5563;
      max-width: 320px;
      margin: 26px 0 0;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card);
    }
    .hint strong { color: var(--muted); font-weight: 600; }

    .status { font-size: 14px; margin: 24px 0 0; }

    /* Auto-redirect is the default; the tap UI only shows when JS asked for it. */
    .tap-only { display: none; }
    .tap .tap-only { display: flex; flex-direction: column; align-items: center; }
    /* The hint is prose — flex would turn each <strong> into its own line. */
    .tap p.tap-only { display: block; }
    .tap .auto-only { display: none; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/logo-appicon.png" width="92" height="92"
         alt="Polyscope app icon: a green whale tail inside a sonar crosshair">
    <h1>Polyscope</h1>
    <p class="tagline">Whale intelligence for Polymarket.</p>

    <div class="auto-only">
      <p class="status">Taking you to the App Store…</p>
    </div>

    <div class="tap-only stack">
      <a class="btn" id="open" href="https://apps.apple.com/us/app/polyscope/id6772628383">Open in App Store</a>
      <div class="rule"></div>
      <a class="sub" id="safari" href="https://apps.apple.com/us/app/polyscope/id6772628383">Not opening? Try Safari</a>
      <a class="sub quiet" id="fallback" href="https://apps.apple.com/us/app/polyscope/id6772628383">Or view the listing here</a>
    </div>

    <p class="tap-only hint">
      Instagram restricts App Store links. If none of these work, tap
      <strong>•••</strong> at the top right and choose <strong>Open in browser</strong>.
    </p>
  </main>
</body>
</html>
